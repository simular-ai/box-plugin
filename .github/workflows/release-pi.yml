name: Release Pi package

# Publishes @simular-ai/box-pi (pi/) to npm when a tag `pi-vX.Y.Z` is pushed.
#
# Cutting a release: bump "version" in pi/package.json, merge to main, then
#   git tag pi-v<X.Y.Z> && git push origin pi-v<X.Y.Z>
#
# Auth: npm trusted publishing (OIDC). Requires the trusted-publisher
# config on npmjs.com (package @simular-ai/box-pi -> Settings -> Trusted Publisher): organization
# "simular-ai", repository "box-plugin", workflow filename "release-pi.yml", environment "npm".
# npm only lets you configure it on a package that already exists, so the first version is
# published once by hand from pi/ (`npm publish --access public`).
#
# Gating: runs in the GitHub environment "npm" and refuses a tag whose commit is not on main.
on:
  push:
    tags: ['pi-v*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tagged commit is on main
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Tag a commit on main." >&2
            exit 1
          fi
      # No `registry-url`: setup-node would write an .npmrc with `_authToken=${NODE_AUTH_TOKEN}`,
      # which shadows the OIDC handshake. Node 24 ships npm 11 (trusted publishing needs >= 11.5.1).
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
      - name: Tag matches pi/package.json
        run: |
          set -euo pipefail
          version=$(node -p "require('./pi/package.json').version")
          if [ "pi-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pi/package.json ($version)." >&2
            exit 1
          fi
      - name: Publish to npmjs.org
        working-directory: pi
        run: npm publish --provenance --access public
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" --title "$TAG_NAME" --notes "Pi package for box. See pi/README.md." --latest=false
