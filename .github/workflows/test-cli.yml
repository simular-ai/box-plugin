name: Test CLI

on:
  pull_request:
    paths: ['cli/**', '.github/workflows/test-cli.yml']
  push:
    branches: [main]
    paths: ['cli/**']

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
