name: CI

# Checks this repo's plugins and the box CLI they use, against real clients. The CLI itself is the
# Rust simular-box, built and published to npm as @simular-ai/box from simular-ai/box-cli; this
# repo publishes no CLI to npm (the old JavaScript CLI that lived in cli/ was retired); the Pi
# package in pi/ is published by release-pi.yml on a pi-v* tag.
#
# Every non-draft PR that touches a plugin folder or e2e/ runs:
#   plugins  each agent's own validator over the plugin folders, and the Claude plugin's CLI pin
#   clients  Layer 1: the pinned CLI against each real, installed client in an isolated HOME
#            (versions pinned in e2e/clients.json). No secrets.
#   live     Layer 2: a real staging key (secret BOX_CI_KEY, variable BOX_CI_MCP_URL) proves the
#            headless clients reach box and list its tools. Never on PRs from forks.
# The CLI under test is `npx -y @simular-ai/box@X.Y.Z` at the version claude/ pins (e2e/cli.mjs).
#
# TODO(layer 3): nightly run against the latest client versions plus a real agent task on a box.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'e2e/**'
      - 'claude/**'
      - 'dsh/**'
      - 'hermes/**'
      - 'openclaw/**'
      - 'pi/**'
      - '.claude-plugin/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'e2e/**'
      - 'claude/**'
      - '.claude-plugin/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plugins:
    name: Validate plugin folders
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install validators (versions from e2e/clients.json)
        run: |
          set -euo pipefail
          spec() { node -p "require('./e2e/clients.json')['$1'].npm"; }
          npm install -g "$(spec claude-code)" "$(spec openclaw)"
          tag=$(node -p "require('./e2e/clients.json').hermes.tag")
          git clone --quiet --depth 1 --branch "$tag" https://github.com/NousResearch/hermes-agent "$RUNNER_TEMP/hermes"
          (cd "$RUNNER_TEMP/hermes" && uv sync --frozen --extra mcp --quiet)
          echo "$RUNNER_TEMP/hermes/.venv/bin" >> "$GITHUB_PATH"
      - name: Claude Code marketplace and plugin
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          claude plugin validate .
          claude plugin validate ./claude
      - name: Plugin pins the CLI to one exact version that is on npm
        # A range (^1.0.0) lets npx run a version published after review; the Claude directory
        # review asks for an exact pin. The CLI is the Rust simular-box, released from
        # simular-ai/box-cli, so the pin follows its npm releases. e2e/ tests this same version.
        run: |
          set -euo pipefail
          pins=$(grep -rhoE '@simular-ai/box@[^ `"]*' claude | sort -u)
          if [ "$(printf '%s\n' "$pins" | grep -c .)" -ne 1 ]; then echo "claude/ must pin one CLI version, found:"; echo "$pins"; exit 1; fi
          v=${pins#@simular-ai/box@}
          if ! printf '%s' "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "pin an exact release, not $pins"; exit 1; fi
          if [ "$(npm view "@simular-ai/box@$v" version)" != "$v" ]; then echo "$pins is not on npm"; exit 1; fi
          echo "claude/ pins $pins"
      - name: DeepSeek Harness package
        run: npm pack ./dsh --dry-run
      - name: Hermes plugin
        run: |
          set -euo pipefail
          if [ ! -d hermes ]; then echo "no hermes/ folder on this ref; skipped"; exit 0; fi
          export HOME="$(mktemp -d)"
          hermes plugins validate ./hermes
      - name: Pi package
        run: |
          set -euo pipefail
          if [ ! -d pi ]; then echo "no pi/ folder on this ref; skipped"; exit 0; fi
          npm pack ./pi --dry-run
          export HOME="$(mktemp -d)"
          npm install -g "$(node -p "require('./e2e/clients.json').pi.npm")"
          pi install ./pi
          # The package's extension registers box; with no sign-in yet Pi reports it as needing one,
          # which proves the server is registered and reachable. No model or key is needed.
          out=$( (printf '%s\n' '{"id":"1","type":"prompt","message":"/mcp"}'; sleep 20) | pi --mode rpc --no-session 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'box: needs sign-in'
      - name: OpenClaw plugin
        run: |
          set -euo pipefail
          if [ ! -d openclaw ]; then echo "no openclaw/ folder on this ref; skipped"; exit 0; fi
          (cd openclaw && npm install --no-audit --no-fund && npm run build)
          export HOME="$(mktemp -d)"
          openclaw plugins install ./openclaw --force --accept-capabilities
          openclaw plugins inspect box
          openclaw plugins doctor

  clients:
    name: Install matrix (${{ matrix.client }}, ${{ matrix.os }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        client: [claude-code, codex, cursor, opencode, gemini-cli, hermes, openclaw]
        exclude:
          # cursor-agent ships for Linux and macOS only.
          - os: windows-latest
            client: cursor
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - name: Install ${{ matrix.client }}
        env:
          CLIENT: ${{ matrix.client }}
        run: |
          set -euo pipefail
          get() { node -p "(require('./e2e/clients.json')['$CLIENT'] || {})['$1'] || ''"; }
          if [ -n "$(get npm)" ]; then
            npm install -g "$(get npm)"
          elif [ "$CLIENT" = hermes ]; then
            git clone --quiet --depth 1 --branch "$(get tag)" "$(get git)" "$RUNNER_TEMP/hermes"
          elif [ "$CLIENT" = cursor ]; then
            os=$(uname -s | tr '[:upper:]' '[:lower:]'); arch=$(uname -m)
            case "$arch" in x86_64|amd64) arch=x64;; arm64|aarch64) arch=arm64;; esac
            mkdir -p "$RUNNER_TEMP/cursor-agent"
            curl -fsSL "https://downloads.cursor.com/lab/$(get cursorAgent)/$os/$arch/agent-cli-package.tar.gz" \
              | tar --strip-components=1 -xzf - -C "$RUNNER_TEMP/cursor-agent"
            echo "$RUNNER_TEMP/cursor-agent" >> "$GITHUB_PATH"
          fi
      - if: matrix.client == 'hermes'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install Hermes dependencies
        if: matrix.client == 'hermes'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hermes"
          uv sync --frozen --extra mcp --quiet
          if [ -d .venv/Scripts ]; then echo "$(cygpath -w "$PWD/.venv/Scripts")" >> "$GITHUB_PATH"; else echo "$PWD/.venv/bin" >> "$GITHUB_PATH"; fi
      - name: connect, list, re-run, doctor, remove
        run: node e2e/install-matrix.mjs ${{ matrix.client }}

  live:
    name: Live staging (headless clients)
    # Needs secrets: push to main, tags, manual runs, and PRs from this repository only, never forks.
    if: >-
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: npm ci
        working-directory: e2e
      - name: Install OpenClaw and Hermes
        run: |
          set -euo pipefail
          npm install -g "$(node -p "require('./e2e/clients.json').openclaw.npm")"
          git clone --quiet --depth 1 --branch "$(node -p "require('./e2e/clients.json').hermes.tag")" https://github.com/NousResearch/hermes-agent "$RUNNER_TEMP/hermes"
          (cd "$RUNNER_TEMP/hermes" && uv sync --frozen --extra mcp --quiet)
          echo "$RUNNER_TEMP/hermes/.venv/bin" >> "$GITHUB_PATH"
      - name: Key valid, clients connect and list box's tools
        env:
          BOX_MCP_URL: ${{ vars.BOX_CI_MCP_URL }}
          BOX_TOKEN: ${{ secrets.BOX_CI_KEY }}
        run: |
          echo "::add-mask::$BOX_TOKEN"
          node e2e/live.mjs hermes openclaw
