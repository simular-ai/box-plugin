name: Release dsh plugin

# Push a tag `dsh-vX.Y.Z` that matches dsh/package.json's version. The packed plugin is attached
# to the GitHub release as dsh-box.tgz. Link the versioned URL in docs and the portal
# (https://github.com/simular-ai/box-plugin/releases/download/dsh-vX.Y.Z/dsh-box.tgz), never
# releases/latest: pnpm caches what a tarball URL resolved to, so new contents behind the same
# URL fail to install. `--latest` below only marks the release on GitHub.
#
# After the release, the `portal` job opens (or updates) a box-portal PR that links the new
# version (bump-portal.yml). Merging and deploying that PR stays a person's call.
on:
  push:
    tags: ['dsh-v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tag matches dsh/package.json
        id: version
        run: |
          set -euo pipefail
          version=$(node -p "require('./dsh/package.json').version")
          test "dsh-v$version" = "$GITHUB_REF_NAME"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Pack
        run: |
          file=$(npm pack ./dsh --silent)
          mv "$file" dsh-box.tgz
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        # A re-run keeps the existing release, so the portal job below still runs.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists; keeping it."
          else
            gh release create "$GITHUB_REF_NAME" dsh-box.tgz --title "$GITHUB_REF_NAME" --notes "DeepSeek Harness plugin for box. See dsh/README.md." --latest
          fi

  portal:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/bump-portal.yml
    with:
      plugin: dsh
      version: ${{ needs.release.outputs.version }}
    secrets:
      SIMULAR_CI_APP_PRIVATE_KEY: ${{ secrets.SIMULAR_CI_APP_PRIVATE_KEY }}
