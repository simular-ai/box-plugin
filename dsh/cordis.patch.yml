# box by Simular for DeepSeek Harness: adds the box MCP server to a dsh profile.
# The model sees box's tools as mcp__box__<tool>.
#
# Paste a box personal key (cb_..., from https://box.simular.ai/keys) on this plugin's page under
# Plugins; dsh keeps it in its credentials store as BOX_TOKEN. An exported BOX_TOKEN or one in
# ~/.dsh/.env works too. BOX_MCP_URL overrides the endpoint (e.g. staging).

- insert:
    # Host half: provides `boxAuth` once a key exists. Its browser half is the key page.
    - id: box-auth
      name: '@simular/dsh-box'

    - id: mcp-box
      name: '@deepseek-ai/dsh-mcp-client'
      inject: [boxAuth]
      config:
        serverName: box
        transport: streamable-http
        url: !!js process.env.BOX_MCP_URL || 'https://mcp.box.simular.ai/mcp'
        headers:
          Authorization: !!js ctx.boxAuth.authorization
        # Waking a box or taking a screenshot can outlast the 60 s default.
        toolCallTimeoutMs: 180000
